# Casbin RBAC 模型定义
#
# 语义：sub = 角色标识(sys_role.code)
#      obj = 权限标识(sys_menu.perms，如 system:user:add)
#      act = 动作，本项目统一用 "*"（权限点本身已含操作语义）
#
# 策略 p 由 service.PermissionService.ReloadPolicies 依据 sys_role_menu 全量生成。
# 不使用 g(role grouping) 规则：用户的角色集合从 JWT 取出后由中间件逐个 Enforce，
# 因此无需在 Casbin 内再维护「用户→角色」关系。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

# obj 精确匹配权限标识；act 用 * 通配。
[matchers]
m = r.sub == p.sub && r.obj == p.obj && (p.act == "*" || r.act == p.act)
