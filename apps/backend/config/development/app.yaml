# 应用基础配置 · development
#
# 环境变量覆盖规则：APP_ + 配置路径大写、点替换为下划线
#   app.port -> APP_APP_PORT

app:
  name: rbac-admin
  env: development
  port: 8080
  # Gin 运行模式：debug / release
  mode: debug
  # 是否启用图形验证码。开发环境关闭，便于用 curl 直接调试登录
  captcha: false

jwt:
  # 严禁写入本文件，必须通过 APP_JWT_SECRET 注入
  secret: ""
  issuer: rbac-admin
  # Access Token 有效期（小时）
  expireHours: 2
  # Refresh Token 有效期（小时），默认 7 天
  refreshExpireHours: 168

crypto:
  # AES-256-GCM 密钥，32 字节（64 位 hex）；必须由 APP_CRYPTO_AESKEY 注入
  aesKey: ""
  # HMAC 盲索引密钥，与 aesKey 相互独立；必须由 APP_CRYPTO_HMACKEY 注入
  hmacKey: ""
  # 当前密钥版本，轮换时递增
  keyVersion: 1

cors:
  allowOrigins:
    - http://localhost:5173
    - http://127.0.0.1:5173

casbin:
  # 相对于进程工作目录
  modelPath: config/rbac_model.conf

upload:
  # 相对于进程工作目录；Docker 部署时挂成数据卷，否则容器重建后头像全部丢失
  dir: uploads
  # 对外访问前缀，需与静态文件路由保持一致
  urlPrefix: /uploads
