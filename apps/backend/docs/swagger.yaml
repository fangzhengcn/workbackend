basePath: /api/v1
definitions:
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.AssignMenusRequest:
    properties:
      menuIds:
        items:
          type: integer
        type: array
    required:
    - menuIds
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.AssignRolesRequest:
    properties:
      roleIds:
        items:
          type: integer
        type: array
    required:
    - roleIds
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.ChangePasswordRequest:
    properties:
      newPassword:
        maxLength: 64
        minLength: 6
        type: string
      oldPassword:
        maxLength: 64
        minLength: 6
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.CreateDeptRequest:
    properties:
      leader:
        maxLength: 64
        type: string
      name:
        maxLength: 64
        type: string
      parentId:
        type: integer
      phone:
        maxLength: 32
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.CreateDictDataRequest:
    properties:
      dictTypeId:
        description: |-
          DictTypeID 决定归属；dict_type 冗余列由服务层按此 ID 推导，不由前端传入，
          避免两者不一致。
        type: integer
      isDefault:
        enum:
        - 0
        - 1
        type: integer
      label:
        maxLength: 100
        type: string
      remark:
        maxLength: 255
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
      value:
        maxLength: 100
        type: string
    required:
    - dictTypeId
    - label
    - value
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.CreateDictTypeRequest:
    properties:
      name:
        maxLength: 64
        type: string
      remark:
        maxLength: 255
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
      type:
        description: |-
          Type 是数据项的归属键，只允许字母/数字/下划线：
          它会作为 URL 路径段用于按类型取数据（/dicts/data/{type}）。
        maxLength: 64
        type: string
    required:
    - name
    - type
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.CreateMenuRequest:
    properties:
      component:
        maxLength: 255
        type: string
      icon:
        maxLength: 100
        type: string
      isFrame:
        enum:
        - 0
        - 1
        type: integer
      name:
        maxLength: 64
        type: string
      parentId:
        type: integer
      path:
        maxLength: 200
        type: string
      perms:
        maxLength: 100
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
      type:
        enum:
        - 1
        - 2
        - 3
        type: integer
      visible:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    - type
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.CreateRoleRequest:
    properties:
      code:
        description: Code 为权限判定依据，只允许字母/数字/下划线/冒号，避免与 Casbin 策略解析冲突。
        maxLength: 64
        type: string
      dataScope:
        enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        type: integer
      deptIds:
        items:
          type: integer
        type: array
      menuIds:
        items:
          type: integer
        type: array
      name:
        maxLength: 64
        type: string
      remark:
        maxLength: 255
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - code
    - name
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.CreateUserRequest:
    properties:
      deptId:
        type: integer
      email:
        maxLength: 128
        type: string
      gender:
        enum:
        - 0
        - 1
        - 2
        type: integer
      nickname:
        maxLength: 64
        type: string
      password:
        maxLength: 64
        minLength: 6
        type: string
      phone:
        type: string
      remark:
        maxLength: 255
        type: string
      roleIds:
        items:
          type: integer
        type: array
      status:
        enum:
