    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.LoginRequest:
    properties:
      captchaCode:
        type: string
      captchaId:
        description: CaptchaID 与 CaptchaCode 配对校验；未启用验证码时可为空。
        type: string
      password:
        maxLength: 64
        minLength: 6
        type: string
      username:
        maxLength: 64
        minLength: 2
        type: string
    required:
    - password
    - username
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.ResetPasswordRequest:
    properties:
      password:
