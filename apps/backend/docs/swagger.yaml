        items:
          type: integer
        type: array
    required:
    - dataScope
    type: object
  github_com_fangzhengcn_workbackend_apps_backend_internal_dto.DeleteLogsRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
