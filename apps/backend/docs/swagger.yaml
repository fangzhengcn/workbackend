info:
  contact: {}
  description: 基于 RBAC 的通用后台管理系统接口
  title: 权限管理后台 API
  version: "1.0"
paths:
  /auth/avatar:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 头像图片（JPG/PNG/GIF/WEBP，不超过 2MB）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 头像访问 URL
          schema:
            allOf:
            - $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
            - properties:
                data:
                  type: string
              type: object
      summary: 上传头像
      tags:
      - 个人中心
  /auth/captcha:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_vo.CaptchaResult'
              type: object
      summary: 获取图形验证码
      tags:
      - 认证
  /auth/info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_vo.UserInfo'
              type: object
      summary: 获取当前用户信息
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_vo.LoginResult'
              type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
      summary: 用户登出
      tags:
      - 认证
  /auth/menus:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_vo.MenuNode'
                  type: array
              type: object
      summary: 获取当前用户菜单树
      tags:
      - 认证
  /auth/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: 密码参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
      summary: 修改自己的密码
      tags:
      - 个人中心
  /auth/profile:
    put:
      consumes:
      - application/json
      parameters:
      - description: 个人资料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
      summary: 修改个人资料
      tags:
      - 个人中心
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: 刷新参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_vo.LoginResult'
              type: object
      summary: 刷新令牌
      tags:
      - 认证
  /depts:
    post:
      consumes:
      - application/json
      parameters:
      - description: 部门信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_dto.CreateDeptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
      summary: 新增部门
      tags:
      - 部门管理
  /depts/{id}:
    delete:
      parameters:
      - description: 部门ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
      summary: 删除部门
      tags:
      - 部门管理
    put:
      consumes:
      - application/json
      parameters:
      - description: 部门ID
        in: path
        name: id
        required: true
        type: integer
      - description: 部门信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_internal_dto.UpdateDeptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_fangzhengcn_workbackend_apps_backend_pkg_response.Body'
      summary: 修改部门
