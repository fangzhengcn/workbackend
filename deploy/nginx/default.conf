server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 请求体上限。
    #
    # nginx 默认只有 1MB，会在请求到达后端之前直接返回 413，
    # 后端日志里连一条记录都没有——排查时容易误以为是接口问题。
    # 这里留到 4MB：头像上限是 2MB，但 multipart 编码有额外开销，
    # 且该值必须不小于后端的业务上限，否则真正的错误提示
    #（「图片不能超过 2MB」）永远没机会返回给用户。
    client_max_body_size 4m;

    # gzip 压缩，显著降低首屏体积（antd chunk 约 875KB → 270KB）
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary         on;

    # 带内容哈希的静态资源可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后能立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 前端 History 路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到后端
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        # 透传真实客户端 IP，后端据此写登录日志与操作日志
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        access_log off;
    }

    # 上传文件（头像）由后端提供。
    #
    # 必须显式代理，理由同 /swagger：否则会被上面的 try_files 当成前端路由
    # 回退到 index.html——<img> 拿到一份 HTML，表现为图片裂开但状态码是 200。
    location /uploads/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 头像文件名含随机哈希，内容不会变，可放心长缓存
        expires 30d;
        add_header Cache-Control "public";
    }

    # Swagger UI 由后端提供（仅非生产环境注册该路由）。
    #
    # 必须显式代理：否则会被上面的 try_files 当成前端路由，
    # 回退到 index.html——表现为「返回 200 但看到的是 Vue 页面」，
    # 状态码正常反而更难发现。
    location /swagger/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
