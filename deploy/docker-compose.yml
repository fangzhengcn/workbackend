# 一键部署：Nginx(前端) + Gin(后端) + MySQL + Redis
#
# 用法（在 deploy/ 目录下）：
#   ./deploy.sh up        首次部署，自动生成密钥
#   ./deploy.sh logs      查看日志
#   ./deploy.sh down      停止
#
# 或用仓库根目录的 make：make deploy / make deploy-down
#
# 所有密钥从 deploy/.env 读取，缺失则启动即失败（不提供不安全的默认值）。

name: rbac-admin

services:
  mysql:
    image: mysql:8.0
    container_name: rbac-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未设置，请运行 ./deploy.sh init 生成 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rbac_admin}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 关闭对 root 的旧密码插件兼容问题
      - --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动导入建表脚本与种子数据（仅在数据卷为空时执行）
      - ../docs/权限系统数据库.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # 默认不对外暴露数据库端口；本地调试需要时取消注释
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - rbac

  redis:
    image: redis:7-alpine
    container_name: rbac-redis
    restart: unless-stopped
    # 有密码则启用鉴权，无密码则裸跑（仅限内网环境）
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
             else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      # 带密码时 redis-cli 需显式传入，否则 ping 会被拒绝
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - rbac

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: rbac-admin/backend:latest
    container_name: rbac-backend
    restart: unless-stopped
    environment:
      # 决定加载 config/{APP_ENV}/ 下的配置。默认 production；
      # 本地用 localhost 访问时需在 .env 里设为 testing——production 的启动校验
      # 禁止 CORS 白名单含 localhost，否则后端会直接启动失败。
      APP_ENV: ${APP_ENV:-production}
      APP_MYSQL_HOST: mysql
      APP_MYSQL_PORT: 3306
      APP_MYSQL_USERNAME: root
      APP_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_MYSQL_DATABASE: ${MYSQL_DATABASE:-rbac_admin}
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: 6379
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 以下三项必须提供，缺失则容器启动失败
      APP_JWT_SECRET: ${APP_JWT_SECRET:?未设置，请运行 ./deploy.sh init 生成 .env}
      APP_CRYPTO_AESKEY: ${APP_CRYPTO_AESKEY:?未设置，请运行 ./deploy.sh init 生成 .env}
      APP_CRYPTO_HMACKEY: ${APP_CRYPTO_HMACKEY:?未设置，请运行 ./deploy.sh init 生成 .env}
      # 生产环境 CORS 白名单，按实际域名覆盖
      APP_CORS_ALLOWORIGINS: ${APP_CORS_ALLOWORIGINS:-}
    volumes:
      - backend-logs:/app/logs
      # 头像等上传文件必须持久化，否则容器重建后全部丢失
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # alpine 自带 busybox wget，无需额外安装工具
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rbac

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: rbac-admin/web:latest
    container_name: rbac-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - rbac

volumes:
  mysql-data:
  redis-data:
  backend-logs:
  backend-uploads:

networks:
  rbac:
    driver: bridge
